<!DOCTYPE html>

                </p>
                
                <div class="links">
                    <a href="https://github.com/k3rlll" target="_blank">GitHub</a>
                    <a href="mailto:r_abdyashim@kbtu.kz">Email</a>

        </article>
    </main>

    <footer>
        <p>&copy; 2026 Ramazan Abdyashim</p>
    </footer>

    <script type="module" src="./main.js"></script>
</body>
</html>
